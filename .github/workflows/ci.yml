name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 19 tools
        run: sdkmanager --install 'platforms;android-19' 'build-tools;34.0.0'
      - name: Test and package debug build
        run: |
          make test
          make package
