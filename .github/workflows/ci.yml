name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native module build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld mksh
      - name: Install Android API 19 tools
        # Use the runner's preinstalled SDK (setup-android@v3 fails installing the removed 'tools' package).
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-19/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-19' 'build-tools;34.0.0'
          fi
      - name: Test and package debug build
        # test depends on package; test exactly the artifacts built here.
        run: make test
